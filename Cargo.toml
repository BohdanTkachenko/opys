[workspace]
members = [
    "opys-backend-markdown-local",
    "opys",
    "opys-server",
]
resolver = "2"

# All four crates share one version and publish together, in the order the
# dependency graph implies: opys-engine, then the backend, then opys-server,
# then the opys binary that links them all.
[workspace.package]
version = "0.13.0"

[package]
name = "opys-engine"
version.workspace = true
edition = "2021"
# 1.88 is the real floor: while gluesql's core only needs edition 2024 (≥ 1.85)
# and gix's tree declares 1.85 throughout, `time` requires 1.88. gix is in the
# default build (ADR-0102), so `msrv` now compiles it too — verify with `msrv`.
rust-version = "1.88"
description = "Core library for opys — a file-based inventory of typed markdown documents with a verify gate and SQL query layer"
license = "Apache-2.0"
repository = "https://github.com/BohdanTkachenko/opys"
readme = "README.md"
keywords = ["feature-inventory", "traceability", "markdown", "sql", "ci"]
categories = ["development-tools"]
# skills/ is shipped: src/templates.rs embeds skills/opys/agent-rule.md.
exclude = [
    ".github/",
    ".claude-plugin/",
    ".codex-plugin/",
    "pi-extension/",
    "package.json",
    "gemini-extension.json",
    "opencode.json",
    # This repo dogfoods opys, so the root package directory contains the
    # project's own inventory — 50-odd documents of product and business
    # planning that are no part of the library. Without this line every
    # `cargo publish` would bake them into the .crate tarball, and a published
    # version is immutable: yanking hides it from the resolver, it does not
    # unpublish the bytes. The 0.12.0 tarball predates the inventory and is
    # clean; keep it that way.
    "inventory/",
]

[features]
default = ["git"]
# In-process git, via gix and never a spawned subprocess: the branch/worktree
# reader (`src/git/`), `opys history <id>`, and the migration seed. On by
# default (ADR-0102) — the reader is what lets `next` and the node see work in
# flight on branches. A project that is not a repository degrades to main-only
# with one notice rather than failing, and `--no-default-features` drops gix
# entirely and compiles that same main-only fallback.
git = ["dep:gix"]
# Compatibility alias for this feature's pre-0.13 name. It is one-way — enabling
# `git` does not enable `history` — so nothing in the tree may be gated on it.
history = ["git"]
# The gix-only repository builder in `src/git/fixture.rs`. Test support, never
# public API: it is `#[doc(hidden)]`, nothing about it is covered by semver, and
# without this feature it compiles only into the engine's own test target — so a
# release build and docs.rs never see it. The `opys` binary turns it on through a
# *dev*-dependency (for `opys/tests/cli.rs`), which reaches no consumer. It
# deliberately does not imply `git`: enabling it in a build without gix is a
# no-op, which is what keeps the `--no-default-features` job an honest main-only
# build despite that unconditional dev-dependency edge.
test-fixtures = []

[lib]
name = "opys_engine"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
serde_json = "1"
toml = "0.8"
regex = "1"
walkdir = "2"
anyhow = "1"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset", "macros"] }
# Only the parser and `markdown_to_html` are used, so the default features are
# all dead weight: `syntect` (syntax highlighting) drags in onig/onig_sys — a C
# build — plus plist and yaml-rust, `cli` pulls comrak's own binary deps, and
# `bon` only adds deprecated builder aliases. `Options` derives `Default`
# unconditionally. Trimmed in opys-server/Cargo.toml too: cargo unifies features
# across the workspace, so one untrimmed edge would keep all of it.
comrak = { version = "0.52", default-features = false }
gluesql = { version = "0.19.0", default-features = false, features = [
    "gluesql_memory_storage",
] }
futures = "0.3"
termimad = "0.34"
gix = { version = "0.84", default-features = false, features = [
    "sha1",
], optional = true }

[dev-dependencies]
tempfile = "3"
