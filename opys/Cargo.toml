[package]
name = "opys"
version.workspace = true
edition = "2021"
rust-version = "1.88"
description = "File-based inventory of typed markdown documents (a git-native, AI-friendly issue tracker) — the opys CLI"
license = "Apache-2.0"
repository = "https://github.com/BohdanTkachenko/opys"
keywords = ["feature-inventory", "traceability", "cli", "markdown", "ci"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []
history = ["opys-engine/history"]
# The interactive terminal UI — off by default so the common (agent/CLI) build
# pulls in no ratatui/crossterm/notify. Build with `--features tui` for humans.
tui = ["dep:opys-tui", "opys-engine/tui"]

[[bin]]
name = "opys"
path = "src/main.rs"

[dependencies]
opys-engine = { path = "..", version = "0.12.0" }
opys-backend-markdown-local = { path = "../opys-backend-markdown-local", version = "0.12.0" }
opys-tui = { path = "../opys-tui", version = "0.12.0", optional = true }
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
assert_fs = "1"
tempfile = "3"
