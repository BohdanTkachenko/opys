[package]
name = "opys-server"
version.workspace = true
edition = "2021"
rust-version = "1.88"
description = "Always-on opys node: watcher, HTTP/WS API, and web UI over local inventories"
# AGPL-3.0-only, unlike the rest of the workspace (Apache-2.0) — see ADR-0056.
# Nothing Apache-side may depend on this crate.
license = "AGPL-3.0-only"
repository = "https://github.com/BohdanTkachenko/opys"
readme = "README.md"
keywords = ["opys", "server", "inventory", "api", "daemon"]
categories = ["development-tools", "web-programming::http-server"]
# Flipped at the M2 milestone, not before.
publish = false

[[bin]]
name = "opys-server"
path = "src/main.rs"

[dependencies]
opys-engine = { path = "..", version = "0.12" }
opys-backend-markdown-local = { path = "../opys-backend-markdown-local", version = "0.12" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
notify = "8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comrak = "0.52"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
