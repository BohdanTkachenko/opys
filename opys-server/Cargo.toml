[package]
name = "opys-server"
version.workspace = true
edition = "2021"
rust-version = "1.88"
description = "Always-on opys node: watcher, HTTP/WS API, and web UI over local inventories"
license = "Apache-2.0"
repository = "https://github.com/BohdanTkachenko/opys"
readme = "README.md"
keywords = ["opys", "server", "inventory", "api", "daemon"]
categories = ["development-tools", "web-programming::http-server"]
# Flipped when the CLI links it for `opys web` (ADR-0077), or at M2 — whichever
# comes first. A published `opys` cannot depend on an unpublished crate.
publish = false

# A library as well as a binary: ADR-0077 makes `opys web` a subcommand of the
# CLI, which means the CLI links this crate. The binary stays for `opys-server`
# on its own and for the systemd unit.
[lib]
name = "opys_server"
path = "src/lib.rs"

[[bin]]
name = "opys-server"
path = "src/main.rs"

[dependencies]
opys-engine = { path = "..", version = "0.12" }
opys-backend-markdown-local = { path = "../opys-backend-markdown-local", version = "0.12" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
notify = "8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comrak = "0.52"
# The allowlist registry is TOML; discovery walks the filesystem. Same versions
# as the engine uses, so neither widens the dependency tree.
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
