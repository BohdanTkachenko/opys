<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0e15" media="(prefers-color-scheme: dark)" />
    <!-- An inline data: URI, not a file: the page must make zero external
         requests, and a /favicon.ico would 404 against the node's JSON
         fallback on every load. A terminal prompt, in the accent gradient. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233fc6ff'/%3E%3Cstop offset='1' stop-color='%23a78bfa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='16' height='16' rx='3.5' fill='%230a0e15'/%3E%3Cpath d='M4.5 5l3 3-3 3' stroke='url(%23g)' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='9' y='10.2' width='3' height='1.6' rx='0.8' fill='url(%23g)'/%3E%3C/svg%3E"
    />
    <title>opys</title>
    <!-- Paint the theme's background before the bundle arrives, so a dark-mode
         load never flashes white. Duplicates two token values from app.css on
         purpose: this must run before any stylesheet is fetched. -->
    <style>
      html {
        background: #f6f7f9;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #0a0e15;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
