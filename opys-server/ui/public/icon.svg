<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The opys mark: a stack of cards, the inventory, one document per card.
       The source of every icon the UI ships; the PNGs are rendered from this
       and icons/icon-maskable.svg by scripts/ui-icons.cjs. -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="8" y1="8" x2="56" y2="56">
      <stop offset="0" stop-color="#3fc6ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0e15"/>
  <rect x="20" y="12" width="30" height="36" rx="4" fill="none" stroke="#a78bfa" stroke-opacity=".45" stroke-width="3"/>
  <rect x="14" y="18" width="30" height="36" rx="4" fill="#0a0e15" stroke="url(#g)" stroke-width="3.5"/>
  <path d="M20 29h18M20 36h12" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round"/>
</svg>
