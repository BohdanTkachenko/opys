[package]
name = "opys-backend-markdown-local"
version.workspace = true
edition = "2021"
rust-version = "1.88"
description = "Markdown + local-filesystem storage backend for opys"
license = "Apache-2.0"
repository = "https://github.com/BohdanTkachenko/opys"
readme = "README.md"
keywords = ["opys", "markdown", "storage", "backend", "inventory"]
categories = ["development-tools", "filesystem"]

[dependencies]
# `default-features = false`: this crate needs nothing from the engine's `git`
# feature, and leaving the edge on defaults would pull gix into the workspace's
# `--no-default-features` build, where the main-only fallback is what CI is
# supposed to be compiling.
opys-engine = { path = "..", version = "0.12.0", default-features = false }
walkdir = "2"
regex = "1"
time = { version = "0.3", features = ["formatting"] }
# flock-style advisory locking for the inventory lock (std's File::lock needs
# rustc ≥ 1.89; this crate's MSRV is 1.88).
fs4 = "0.13"

[dev-dependencies]
tempfile = "3"
