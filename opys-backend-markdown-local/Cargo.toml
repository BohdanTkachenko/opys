[package]
name = "opys-backend-markdown-local"
version = "0.11.0"
edition = "2021"
rust-version = "1.88"
# Internal to the workspace (GitHub-only distribution); not published to crates.io.
publish = false
description = "Markdown + local-filesystem storage backend for opys"
license = "Apache-2.0"
repository = "https://github.com/BohdanTkachenko/opys"

[dependencies]
opys = { path = ".." }
walkdir = "2"
regex = "1"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"
