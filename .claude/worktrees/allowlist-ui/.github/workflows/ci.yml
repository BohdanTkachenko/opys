name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test (all features)
        run: cargo test --all --all-features
      - name: Packaging manifest versions in sync
        run: scripts/sync-versions.sh --check

  msrv:
    name: Build (MSRV 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets

  # opys-server/ui/dist is a committed build product embedded by build.rs
  # (ADR-0078), so nothing else would notice it going stale. A job of its own,
  # not a step in `test`: that job is the long pole and has no Node, and Node
  # must stay out of every cargo job — the crate build never runs it.
  # Keep node-version aligned with nodejs_22 in flake.nix.
  ui:
    name: Web UI bundle in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: opys-server/ui/package-lock.json
      - name: Bundle matches its sources
        run: scripts/ui-build.sh --check
