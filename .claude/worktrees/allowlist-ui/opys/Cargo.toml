[package]
name = "opys"
version.workspace = true
edition = "2021"
rust-version = "1.88"
description = "File-based inventory of typed markdown documents (a git-native, AI-friendly issue tracker) — the opys CLI"
license = "Apache-2.0"
repository = "https://github.com/BohdanTkachenko/opys"
# Crate-local README: the workspace README.md is at the repo root, outside this
# crate dir, so `readme = "README.md"` (the root) broke publish — see 59f79ad.
readme = "README.md"
keywords = ["feature-inventory", "traceability", "cli", "markdown", "ci"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []
history = ["opys-engine/history"]

[[bin]]
name = "opys"
path = "src/main.rs"

[dependencies]
opys-engine = { path = "..", version = "0.12.0" }
opys-backend-markdown-local = { path = "../opys-backend-markdown-local", version = "0.12.0" }
# The always-on node, mounted as `opys web`. Linked unconditionally rather than
# behind a cargo feature: a `cargo install opys` whose `opys web` did not exist
# would defeat the reason for folding it in (ADR-0077).
opys-server = { path = "../opys-server", version = "0.12.0" }
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
assert_fs = "1"
tempfile = "3"
# The lock tests hold the inventory lock from the test harness side.
fs4 = "0.13"
